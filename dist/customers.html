<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers – Quick Serve</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-wrapper">
  <header class="topbar">
    <a href="index.html" class="topbar-brand">Quick Serve</a>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <a href="#" id="topbar-logout">Sign out</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Customers</h1>
          <p>Registered customer accounts.</p>
        </div>
      </div>

      <!-- Search -->
      <div class="card" style="padding:.9rem 1.25rem; margin-bottom:1.25rem;">
        <div class="flex gap-2 items-center">
          <input class="form-control" type="search" id="search-customer" placeholder="Search by name or email..." style="max-width:320px;">
          <span class="text-muted text-sm" id="customer-count"></span>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Orders</th>
                <th>Role</th>
              </tr>
            </thead>
            <tbody id="customers-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <footer>Quick Serve Menu Ordering System &copy; 2024</footer>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.require(true);
  if (!user) return;
  UI.renderTopbar(user);
  renderSidebar('customers', user);

  const allUsers  = Data.getUsers().filter(u => !u.is_staff);
  const allOrders = Data.getOrders();

  function render() {
    const q = document.getElementById('search-customer').value.toLowerCase();
    let users = allUsers;
    if (q) users = users.filter(u => u.username.toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q));
    document.getElementById('customer-count').textContent = `${users.length} customer${users.length !== 1 ? 's' : ''}`;
    const tbody = document.getElementById('customers-tbody');
    if (users.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="tbl-empty">No customers found.</td></tr>'; return; }
    tbody.innerHTML = users.map(u => {
      const orderCount = allOrders.filter(o => o.customer_id === u.id).length;
      return `<tr>
        <td style="font-weight:600;">${escHtml(u.username)}</td>
        <td class="text-muted text-sm">${escHtml(u.email) || '—'}</td>
        <td class="text-sm">${escHtml(u.phone) || '—'}</td>
        <td class="text-sm text-muted">${escHtml(u.address) || '—'}</td>
        <td><a href="orders.html" class="text-sm">${orderCount}</a></td>
        <td><span class="badge badge-available">Customer</span></td>
      </tr>`;
    }).join('');
  }

  document.getElementById('search-customer').addEventListener('input', render);
  render();
});

function escHtml(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(str || ''));
  return d.innerHTML;
}
</script>
</body>
</html>
