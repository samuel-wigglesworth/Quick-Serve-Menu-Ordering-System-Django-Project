<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Order – Quick Serve</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-wrapper">
  <header class="topbar">
    <a href="index.html" class="topbar-brand">Quick Serve</a>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <a href="#" id="topbar-logout">Sign out</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 id="page-title">Manage Order</h1>
          <p>Update the status for this order.</p>
        </div>
        <a href="orders.html" class="btn btn-secondary">Back to Orders</a>
      </div>

      <div class="card form-wrap">
        <div id="alert-area"></div>
        <div class="form-group">
          <label>Customer</label>
          <div id="order-customer" class="text-muted text-sm" style="padding:.3rem 0;"></div>
        </div>
        <div class="form-group">
          <label>Current Status</label>
          <div id="order-status-current" style="padding:.3rem 0;"></div>
        </div>
        <div class="form-group">
          <label>Current Total</label>
          <div id="order-total" class="text-sm text-muted" style="padding:.3rem 0;"></div>
        </div>

        <hr style="border:none; border-top:1px solid var(--clr-border); margin:1rem 0;">

        <form id="status-form" novalidate>
          <div class="form-group">
            <label for="new-status">New Status <span class="required">*</span></label>
            <select class="form-control" id="new-status">
              <option value="pending">Pending</option>
              <option value="preparing">Preparing</option>
              <option value="ready">Ready</option>
              <option value="dispatched">Dispatched</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="flex gap-2">
            <button type="submit" class="btn btn-primary">Save Status</button>
            <a id="view-detail" href="#" class="btn btn-secondary">View Detail</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <footer>Quick Serve Menu Ordering System &copy; 2024</footer>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.require(true); // staff only
  if (!user) return;
  UI.renderTopbar(user);
  renderSidebar('orders', user);

  const orderId = Number(new URLSearchParams(location.search).get('id'));
  const order = Data.getOrder(orderId);
  if (!order) { document.getElementById('alert-area').innerHTML = '<div class="alert alert-error">Order not found.</div>'; return; }

  document.getElementById('page-title').textContent = `Manage Order #${order.id}`;
  const customer = Data.getUser(order.customer_id);
  document.getElementById('order-customer').textContent = customer ? customer.username : 'Unknown';
  document.getElementById('order-status-current').innerHTML = UI.statusBadge(order.status);
  document.getElementById('order-total').textContent = UI.formatCurrency(Data.getOrderTotal(order));
  document.getElementById('new-status').value = order.status;
  document.getElementById('view-detail').href = `order-detail.html?id=${orderId}`;

  document.getElementById('status-form').addEventListener('submit', e => {
    e.preventDefault();
    const newStatus = document.getElementById('new-status').value;
    Data.updateOrderStatus(orderId, newStatus);
    document.getElementById('order-status-current').innerHTML = UI.statusBadge(newStatus);
    document.getElementById('alert-area').innerHTML = '<div class="alert alert-success">Order status updated.</div>';
    setTimeout(() => window.location.href = `order-detail.html?id=${orderId}`, 1200);
  });
});
</script>
</body>
</html>
