<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | QuickServe — Indian Food Ordering</title>
  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Custom Theme -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgba(255, 107, 0, 0.12) 0%, rgba(192, 57, 43, 0.08) 90%), #FFF8F0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--color-border);
      background: #ffffff;
      padding: 2.5rem 2rem;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="mb-2"><i class="fa fa-utensils fa-2x text-saffron"></i></div>
      <h2 class="fw-bold mb-1" style="color:var(--color-deep-red);">QuickServe</h2>
      <p class="text-muted small fst-italic">Create your account to start ordering.</p>
    </div>

    <div id="alert-area"></div>

    <form id="signup-form" novalidate>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <label for="username" class="form-label small fw-bold">Username <span class="text-danger">*</span></label>
          <input type="text" class="form-control form-control-sm" id="username" placeholder="Choose a username" required>
        </div>
        <div class="col-6">
          <label for="full_name" class="form-label small fw-bold">Full Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control form-control-sm" id="full_name" placeholder="Enter full name" required>
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label for="email" class="form-label small fw-bold">Email Address <span class="text-danger">*</span></label>
          <input type="email" class="form-control form-control-sm" id="email" placeholder="you@example.in" required>
        </div>
        <div class="col-6">
          <label for="phone" class="form-label small fw-bold">Mobile (+91) <span class="text-danger">*</span></label>
          <input type="tel" class="form-control form-control-sm" id="phone" placeholder="+91 98765 00000" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label small fw-bold">Delivery Address</label>
        <textarea class="form-control form-control-sm" id="address" rows="2" placeholder="House/Flat No, Apartment, Landmark, City"></textarea>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label for="password" class="form-label small fw-bold">Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control form-control-sm" id="password" placeholder="Min. 6 chars" required>
        </div>
        <div class="col-6">
          <label for="password2" class="form-label small fw-bold">Confirm Password <span class="text-danger">*</span></label>
          <input type="password" class="form-control form-control-sm" id="password2" placeholder="Repeat password" required>
        </div>
      </div>

      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="is_staff">
        <label class="form-check-label small" for="is_staff">Register as restaurant staff member</label>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow-sm">
        <i class="fa fa-user-check me-1"></i> Create QuickServe Account
      </button>
    </form>

    <div class="text-center">
      <span class="text-muted small">Already have an account? </span>
      <a href="login.html" class="fw-bold text-saffron text-decoration-none">Sign In Here</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    if (Auth.current()) {
      window.location.href = 'index.html';
      return;
    }

    document.getElementById('signup-form').addEventListener('submit', e => {
      e.preventDefault();
      const username  = document.getElementById('username').value.trim();
      const full_name = document.getElementById('full_name').value.trim();
      const email     = document.getElementById('email').value.trim();
      const phone     = document.getElementById('phone').value.trim();
      const address   = document.getElementById('address').value.trim();
      const pass      = document.getElementById('password').value;
      const pass2     = document.getElementById('password2').value;
      const is_staff  = document.getElementById('is_staff').checked;

      if (!username || !full_name || !email || !phone || !pass) {
        UI.showAlert('Please fill in all required fields.', 'error');
        return;
      }

      if (Data.getUsers().find(u => u.username.toLowerCase() === username.toLowerCase())) {
        UI.showAlert('That username is already taken. Please choose another.', 'error');
        return;
      }

      if (pass.length < 6) {
        UI.showAlert('Password must be at least 6 characters long.', 'error');
        return;
      }

      if (pass !== pass2) {
        UI.showAlert('Passwords do not match.', 'error');
        return;
      }

      const newUser = Data.addUser({
        username,
        full_name,
        email,
        phone,
        address,
        password: pass,
        is_staff
      });

      // Auto login
      QS.set('session', {
        id: newUser.id,
        username: newUser.username,
        full_name: newUser.full_name,
        is_staff: newUser.is_staff
      });

      UI.showAlert('Account created! Welcome to QuickServe.', 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
    });
  });
  </script>
</body>
</html>
