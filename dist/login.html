<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Quick Serve</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Quick Serve</h1>
      <p>Menu Ordering System</p>
    </div>

    <div id="alert-area"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username <span class="required">*</span></label>
        <input class="form-control" type="text" id="username" autocomplete="username" placeholder="Enter your username">
        <div class="field-error hidden" id="err-username"></div>
      </div>
      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input class="form-control" type="password" id="password" autocomplete="current-password" placeholder="Enter your password">
        <div class="field-error hidden" id="err-password"></div>
      </div>
      <button type="submit" class="btn btn-primary w-full mt-2">Sign In</button>
    </form>

    <p class="auth-divider">Don't have an account?</p>
    <a href="signup.html" class="btn btn-secondary w-full" style="justify-content:center;">Create Account</a>

    <p class="text-sm text-muted mt-3" style="text-align:center">
      Demo: <strong>admin / admin123</strong> (staff) &nbsp;|&nbsp; <strong>john / pass123</strong> (customer)
    </p>
  </div>
</div>

<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Already logged in? Go to dashboard
  if (Auth.current()) window.location.href = 'index.html';

  document.getElementById('login-form').addEventListener('submit', e => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    let valid = true;

    document.getElementById('err-username').classList.add('hidden');
    document.getElementById('err-password').classList.add('hidden');

    if (!username) {
      document.getElementById('err-username').textContent = 'Username is required.';
      document.getElementById('err-username').classList.remove('hidden');
      document.getElementById('username').classList.add('error');
      valid = false;
    }
    if (!password) {
      document.getElementById('err-password').textContent = 'Password is required.';
      document.getElementById('err-password').classList.remove('hidden');
      document.getElementById('password').classList.add('error');
      valid = false;
    }
    if (!valid) return;

    if (Auth.login(username, password)) {
      window.location.href = 'index.html';
    } else {
      const alert = document.getElementById('alert-area');
      alert.innerHTML = '<div class="alert alert-error">Invalid username or password. Please try again.</div>';
    }
  });
});
</script>
</body>
</html>
