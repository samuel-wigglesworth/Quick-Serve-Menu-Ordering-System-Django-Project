<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | QuickServe — Indian Food Ordering</title>
  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Custom Theme -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgba(255, 107, 0, 0.12) 0%, rgba(192, 57, 43, 0.08) 90%), #FFF8F0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--color-border);
      background: #ffffff;
      padding: 2.5rem 2rem;
    }
    .demo-pill {
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.8rem;
    }
    .demo-pill:hover {
      background-color: var(--color-saffron) !important;
      color: #fff !important;
      border-color: var(--color-saffron) !important;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="mb-2"><i class="fa fa-utensils fa-2x text-saffron"></i></div>
      <h2 class="fw-bold mb-1" style="color:var(--color-deep-red);">QuickServe</h2>
      <p class="text-muted small fst-italic">Online Food Ordering &amp; Kitchen Management</p>
    </div>

    <div id="alert-area"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label small fw-bold">Username <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fa fa-user text-saffron"></i></span>
          <input type="text" class="form-control" id="username" autocomplete="username" placeholder="Enter your username" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-bold">Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fa fa-lock text-saffron"></i></span>
          <input type="password" class="form-control" id="password" autocomplete="current-password" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow-sm">
        <i class="fa fa-sign-in-alt me-1"></i> Sign In
      </button>
    </form>

    <div class="text-center mb-3">
      <span class="text-muted small">New customer? </span>
      <a href="signup.html" class="fw-bold text-saffron text-decoration-none">Create an Account with your details</a>
    </div>

    <!-- Quick Demo Staff Login -->
    <div class="border-top pt-3 text-center">
      <small class="text-muted d-block fw-bold mb-2">Staff Administrator Demo:</small>
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <button class="btn btn-sm btn-outline-warning text-dark demo-pill" data-user="admin" data-pass="admin123">
          <i class="fa fa-shield-alt text-saffron me-1"></i> 1-Click Staff Login (admin)
        </button>
        <a href="signup.html" class="btn btn-sm btn-outline-primary demo-pill text-decoration-none">
          <i class="fa fa-user-plus me-1"></i> Register as Customer
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    // Already logged in? Redirect to dashboard
    if (Auth.current()) {
      window.location.href = 'index.html';
      return;
    }

    const form = document.getElementById('login-form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;

      if (!u || !p) {
        UI.showAlert('Please enter both username and password.', 'error');
        return;
      }

      if (Auth.login(u, p)) {
        window.location.href = 'index.html';
      } else {
        UI.showAlert('Invalid username or password. Please try again or create an account.', 'error');
      }
    });

    // 1-Click demo pill for staff
    document.querySelectorAll('.demo-pill[data-user]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('username').value = btn.dataset.user;
        document.getElementById('password').value = btn.dataset.pass;
        if (Auth.login(btn.dataset.user, btn.dataset.pass)) {
          window.location.href = 'index.html';
        }
      });
    });
  });
  </script>
</body>
</html>
