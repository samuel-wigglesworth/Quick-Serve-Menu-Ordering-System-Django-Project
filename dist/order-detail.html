<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Detail – Quick Serve</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-wrapper">
  <header class="topbar">
    <a href="index.html" class="topbar-brand">Quick Serve</a>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <a href="#" id="topbar-logout">Sign out</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 id="page-title">Order Detail</h1>
          <p id="page-sub"></p>
        </div>
        <a href="orders.html" class="btn btn-secondary">Back to Orders</a>
      </div>

      <div id="alert-area"></div>

      <div style="display:grid; grid-template-columns:1fr 300px; gap:1.5rem;" id="detail-layout">

        <div>
          <!-- Items -->
          <div class="card">
            <div class="card-title">Order Items</div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Item</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr></thead>
                <tbody id="items-tbody"></tbody>
                <tfoot id="order-tfoot"></tfoot>
              </table>
            </div>
          </div>

          <!-- Delivery tracker -->
          <div class="card" id="tracker-card">
            <div class="card-title">Delivery Status</div>
            <div class="tracker-steps" id="tracker-steps"></div>
            <div id="delivery-info" style="margin-top:.75rem;"></div>
          </div>
        </div>

        <!-- Side panel -->
        <div>
          <div class="card">
            <div class="card-title">Order Info</div>
            <dl id="order-meta" style="font-size:.9rem; display:grid; grid-template-columns:auto 1fr; gap:.5rem .75rem;"></dl>
          </div>

          <div class="card" id="staff-actions" style="display:none;">
            <div class="card-title">Actions</div>
            <a id="btn-manage" href="#" class="btn btn-primary w-full mb-1">Update Status</a>
            <a id="btn-delivery" href="#" class="btn btn-secondary w-full">Update Delivery</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer>Quick Serve Menu Ordering System &copy; 2024</footer>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
const STEPS = ['pending','preparing','ready','dispatched','delivered'];

document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.require();
  if (!user) return;
  UI.renderTopbar(user);
  renderSidebar('orders', user);

  if (window.innerWidth < 700) document.getElementById('detail-layout').style.gridTemplateColumns = '1fr';

  const params = new URLSearchParams(location.search);
  const orderId = Number(params.get('id'));
  const isNew = params.get('new') === '1';

  const order = Data.getOrder(orderId);
  if (!order) {
    document.querySelector('.main-content').innerHTML += '<div class="alert alert-error">Order not found.</div>';
    return;
  }
  if (!user.is_staff && order.customer_id !== user.id) {
    window.location.href = 'orders.html';
    return;
  }

  if (isNew) {
    document.getElementById('alert-area').innerHTML = '<div class="alert alert-success">Your order has been placed successfully.</div>';
  }

  document.getElementById('page-title').textContent = `Order #${order.id}`;
  document.getElementById('page-sub').textContent = `Placed on ${UI.formatDate(order.created_at)}`;

  // Meta
  const customer = Data.getUser(order.customer_id);
  const meta = document.getElementById('order-meta');
  meta.innerHTML = `
    <dt class="text-muted">Customer</dt><dd>${customer ? escHtml(customer.username) : 'Unknown'}</dd>
    <dt class="text-muted">Status</dt><dd>${UI.statusBadge(order.status)}</dd>
    <dt class="text-muted">Date</dt><dd class="text-sm">${UI.formatDate(order.created_at)}</dd>
    <dt class="text-muted">Total</dt><dd style="font-weight:700;">${UI.formatCurrency(Data.getOrderTotal(order))}</dd>
  `;

  // Items
  const tbody = document.getElementById('items-tbody');
  tbody.innerHTML = order.items.map(li => {
    const item = Data.getMenuItem(li.menu_item_id);
    const sub  = item ? item.price * li.quantity : 0;
    return `<tr>
      <td>${item ? escHtml(item.name) : '<em>Deleted item</em>'}</td>
      <td>${li.quantity}</td>
      <td>${item ? UI.formatCurrency(item.price) : '—'}</td>
      <td style="font-weight:600;">${UI.formatCurrency(sub)}</td>
    </tr>`;
  }).join('');
  document.getElementById('order-tfoot').innerHTML = `
    <tr style="border-top:2px solid var(--clr-border);">
      <td colspan="3" style="text-align:right; font-weight:700; padding:.75rem 1rem;">Total</td>
      <td style="font-weight:700; padding:.75rem 1rem;">${UI.formatCurrency(Data.getOrderTotal(order))}</td>
    </tr>`;

  // Tracker
  const trackerEl = document.getElementById('tracker-steps');
  const stepIndex = STEPS.indexOf(order.status);
  if (order.status === 'cancelled') {
    trackerEl.innerHTML = '<span class="badge badge-cancelled" style="font-size:.85rem; padding:.35rem 1rem;">Order Cancelled</span>';
  } else {
    trackerEl.innerHTML = STEPS.map((s, i) => {
      let cls = '';
      if (i < stepIndex) cls = 'done';
      else if (i === stepIndex) cls = 'current';
      const labels = { pending:'Pending', preparing:'Preparing', ready:'Ready', dispatched:'Dispatched', delivered:'Delivered' };
      return `<div class="tracker-step ${cls}">
        <div class="step-dot">${i < stepIndex ? checkSVG() : (i + 1)}</div>
        <div class="step-label">${labels[s]}</div>
      </div>`;
    }).join('');
  }

  // Delivery info
  const delivery = Data.getDelivery(orderId);
  const deliveryInfo = document.getElementById('delivery-info');
  if (delivery && delivery.rider_name) {
    deliveryInfo.innerHTML = `
      <dl style="font-size:.875rem; display:grid; grid-template-columns:auto 1fr; gap:.4rem .75rem;">
        <dt class="text-muted">Rider</dt><dd>${escHtml(delivery.rider_name)}</dd>
        <dt class="text-muted">Location</dt><dd>${escHtml(delivery.current_location)}</dd>
        <dt class="text-muted">ETA</dt><dd>${escHtml(delivery.eta)}</dd>
        <dt class="text-muted">Updated</dt><dd class="text-sm">${UI.formatDate(delivery.updated_at)}</dd>
      </dl>`;
  } else {
    deliveryInfo.innerHTML = '<p class="text-muted text-sm">Delivery details not yet available.</p>';
  }

  // Staff actions
  if (user.is_staff) {
    document.getElementById('staff-actions').style.display = '';
    document.getElementById('btn-manage').href   = `order-manage.html?id=${orderId}`;
    document.getElementById('btn-delivery').href = `delivery-update.html?id=${orderId}`;
  }
});

function checkSVG() {
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
}
function escHtml(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(str || ''));
  return d.innerHTML;
}
</script>
</body>
</html>
