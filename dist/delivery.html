<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Tracking – Quick Serve</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-wrapper">
  <header class="topbar">
    <a href="index.html" class="topbar-brand">Quick Serve</a>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <a href="#" id="topbar-logout">Sign out</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Delivery Tracking</h1>
          <p id="tracking-subtitle">Track the status of active deliveries.</p>
        </div>
      </div>

      <div id="tracking-list"></div>
    </main>
  </div>

  <footer>Quick Serve Menu Ordering System &copy; 2024</footer>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
const STEPS = ['pending','preparing','ready','dispatched','delivered'];

document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.require();
  if (!user) return;
  UI.renderTopbar(user);
  renderSidebar('delivery', user);

  const allOrders = user.is_staff ? Data.getOrders() : Data.getOrdersForUser(user.id);
  const active = allOrders.filter(o => !['delivered','cancelled'].includes(o.status));
  const list = document.getElementById('tracking-list');

  if (active.length === 0) {
    list.innerHTML = '<div class="alert alert-info">No active deliveries at this time.</div>';
    return;
  }

  list.innerHTML = active.map(order => {
    const customer  = Data.getUser(order.customer_id);
    const delivery  = Data.getDelivery(order.id);
    const stepIndex = STEPS.indexOf(order.status);

    const stepsHtml = STEPS.map((s, i) => {
      let cls = '';
      if (i < stepIndex) cls = 'done';
      else if (i === stepIndex) cls = 'current';
      const labels = { pending:'Pending', preparing:'Preparing', ready:'Ready', dispatched:'Dispatched', delivered:'Delivered' };
      return `<div class="tracker-step ${cls}">
        <div class="step-dot">${i < stepIndex ? checkSVG() : (i+1)}</div>
        <div class="step-label">${labels[s]}</div>
      </div>`;
    }).join('');

    const deliveryDetails = delivery ? `
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:.6rem; margin-top:1rem; font-size:.875rem;">
        <div><div class="text-muted" style="font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.2rem;">Rider</div><div>${escHtml(delivery.rider_name || 'Not assigned')}</div></div>
        <div><div class="text-muted" style="font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.2rem;">Location</div><div>${escHtml(delivery.current_location || 'Not available')}</div></div>
        <div><div class="text-muted" style="font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.2rem;">ETA</div><div>${escHtml(delivery.eta || 'Unknown')}</div></div>
        <div><div class="text-muted" style="font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.2rem;">Updated</div><div>${UI.formatDate(delivery.updated_at)}</div></div>
      </div>` : `<p class="text-muted text-sm" style="margin-top:.75rem;">Delivery details not yet available.</p>`;

    return `<div class="card">
      <div class="flex justify-between items-center" style="flex-wrap:wrap; gap:.5rem; margin-bottom:.75rem;">
        <div>
          <span style="font-weight:700; font-size:1rem;">Order #${order.id}</span>
          ${user.is_staff ? `<span class="text-muted text-sm" style="margin-left:.6rem;">— ${customer ? escHtml(customer.username) : 'Unknown'}</span>` : ''}
        </div>
        <div class="flex gap-1">
          ${UI.statusBadge(order.status)}
          <a href="order-detail.html?id=${order.id}" class="btn btn-xs btn-secondary">View Order</a>
          ${user.is_staff ? `<a href="delivery-update.html?id=${order.id}" class="btn btn-xs btn-primary">Update</a>` : ''}
        </div>
      </div>
      <div class="tracker-steps">${stepsHtml}</div>
      ${deliveryDetails}
    </div>`;
  }).join('');
});

function checkSVG() {
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
}
function escHtml(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(str || ''));
  return d.innerHTML;
}
</script>
</body>
</html>
