<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Quick Serve</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-wrapper">

  <!-- Top Bar -->
  <header class="topbar">
    <a href="index.html" class="topbar-brand">Quick Serve</a>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <a href="#" id="topbar-logout">Sign out</a>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar"></nav>

    <!-- Content -->
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 id="welcome-msg">Dashboard</h1>
          <p>Welcome back. Here is what is happening today.</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Recent Orders -->
      <div class="card">
        <div class="card-title">Recent Orders</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Total</th>
                <th>Date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="recent-orders"></tbody>
          </table>
        </div>
      </div>

      <!-- Quick Links -->
      <div class="card">
        <div class="card-title">Quick Actions</div>
        <div class="quick-links" id="quick-links"></div>
      </div>
    </main>
  </div>

  <footer>Quick Serve Menu Ordering System &copy; 2024</footer>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.require();
  if (!user) return;
  UI.renderTopbar(user);
  renderSidebar('dashboard', user);
  UI.setActiveNav('dashboard');

  document.getElementById('welcome-msg').textContent = 'Welcome, ' + user.username;

  const orders   = Data.getOrders();
  const myOrders = user.is_staff ? orders : Data.getOrdersForUser(user.id);
  const menu     = Data.getMenuItems();

  // Stats
  const statsGrid = document.getElementById('stats-grid');
  if (user.is_staff) {
    const delivered = orders.filter(o => o.status === 'delivered').length;
    const pending   = orders.filter(o => o.status === 'pending').length;
    statsGrid.innerHTML = `
      <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value">${orders.length}</div><div class="stat-sub">All time</div></div>
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value">${pending}</div><div class="stat-sub">Awaiting preparation</div></div>
      <div class="stat-card"><div class="stat-label">Delivered</div><div class="stat-value">${delivered}</div><div class="stat-sub">Completed orders</div></div>
      <div class="stat-card"><div class="stat-label">Menu Items</div><div class="stat-value">${menu.filter(m=>m.is_available).length}</div><div class="stat-sub">Currently available</div></div>
    `;
  } else {
    const active = myOrders.filter(o => !['delivered','cancelled'].includes(o.status)).length;
    statsGrid.innerHTML = `
      <div class="stat-card"><div class="stat-label">My Orders</div><div class="stat-value">${myOrders.length}</div><div class="stat-sub">All time</div></div>
      <div class="stat-card"><div class="stat-label">Active Orders</div><div class="stat-value">${active}</div><div class="stat-sub">In progress</div></div>
      <div class="stat-card"><div class="stat-label">Menu Items</div><div class="stat-value">${menu.filter(m=>m.is_available).length}</div><div class="stat-sub">Available to order</div></div>
    `;
  }

  // Recent orders table (latest 5)
  const recent = [...myOrders].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0,5);
  const tbody = document.getElementById('recent-orders');
  if (recent.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="tbl-empty">No orders yet.</td></tr>';
  } else {
    tbody.innerHTML = recent.map(o => {
      const u = Data.getUser(o.customer_id);
      return `<tr>
        <td><a href="order-detail.html?id=${o.id}">#${o.id}</a></td>
        <td>${u ? u.username : 'Unknown'}</td>
        <td>${UI.statusBadge(o.status)}</td>
        <td>${UI.formatCurrency(Data.getOrderTotal(o))}</td>
        <td class="text-muted text-sm">${UI.formatDate(o.created_at)}</td>
        <td><a href="order-detail.html?id=${o.id}" class="btn btn-xs btn-secondary">View</a></td>
      </tr>`;
    }).join('');
  }

  // Quick Links
  const links = [
    { href: 'menu.html',       label: 'View Menu',       sub: 'Browse available items',      icon: menuIcon() },
    { href: 'order-create.html', label: 'Place Order',   sub: 'Start a new order',           icon: orderIcon() },
    { href: 'orders.html',     label: 'Order History',   sub: 'View all orders',             icon: histIcon() },
    { href: 'delivery.html',   label: 'Delivery Tracking', sub: 'Track active deliveries',  icon: truckIcon() },
  ];
  if (user.is_staff) {
    links.push({ href: 'menu-manage.html', label: 'Manage Menu', sub: 'Add or edit items', icon: mgmtIcon() });
    links.push({ href: 'reports.html',     label: 'Reports',     sub: 'Sales analytics',   icon: reportIcon() });
  }
  document.getElementById('quick-links').innerHTML = links.map(l =>
    `<a href="${l.href}" class="quick-link-card">
       <div class="ql-icon">${l.icon}</div>
       <div class="ql-text"><strong>${l.label}</strong><span>${l.sub}</span></div>
     </a>`
  ).join('');
});

function menuIcon()   { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`; }
function orderIcon()  { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>`; }
function histIcon()   { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4"/><polyline points="3 21 3 15 9 15"/></svg>`; }
function truckIcon()  { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`; }
function mgmtIcon()   { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`; }
function reportIcon() { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`; }
</script>
</body>
</html>
