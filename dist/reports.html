<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports – Quick Serve</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-wrapper">
  <header class="topbar">
    <a href="index.html" class="topbar-brand">Quick Serve</a>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <a href="#" id="topbar-logout">Sign out</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Reports</h1>
          <p>Sales analytics and order summary.</p>
        </div>
      </div>

      <!-- KPI cards -->
      <div class="stats-grid" id="kpi-grid"></div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;" id="reports-layout">

        <!-- Top Items -->
        <div class="card">
          <div class="card-title">Top 5 Most Ordered Items</div>
          <div class="report-bar-wrap" id="top-items-bars"></div>
        </div>

        <!-- Status breakdown -->
        <div class="card">
          <div class="card-title">Orders by Status</div>
          <div class="report-bar-wrap" id="status-bars"></div>
        </div>
      </div>

      <!-- Orders table summary -->
      <div class="card">
        <div class="card-title">Recent Orders Summary</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th></tr>
            </thead>
            <tbody id="report-orders-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <footer>Quick Serve Menu Ordering System &copy; 2024</footer>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.require(true);
  if (!user) return;
  UI.renderTopbar(user);
  renderSidebar('reports', user);

  if (window.innerWidth < 700) document.getElementById('reports-layout').style.gridTemplateColumns = '1fr';

  const orders   = Data.getOrders();
  const menuItems = Data.getMenuItems();

  // KPIs
  const total     = orders.length;
  const delivered = orders.filter(o => o.status === 'delivered').length;
  const revenue   = orders.reduce((s, o) => s + Data.getOrderTotal(o), 0);
  const pending   = orders.filter(o => o.status === 'pending').length;
  document.getElementById('kpi-grid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Delivered</div><div class="stat-value">${delivered}</div></div>
    <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value">${pending}</div></div>
    <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value">${UI.formatCurrency(revenue)}</div><div class="stat-sub">From all orders</div></div>
  `;

  // Top items
  const itemTotals = {};
  orders.forEach(o => {
    o.items.forEach(li => {
      itemTotals[li.menu_item_id] = (itemTotals[li.menu_item_id] || 0) + li.quantity;
    });
  });
  const topItems = Object.entries(itemTotals)
    .map(([id, qty]) => ({ item: menuItems.find(m => m.id === Number(id)), qty }))
    .filter(x => x.item)
    .sort((a, b) => b.qty - a.qty)
    .slice(0, 5);

  const maxQty = topItems.length ? topItems[0].qty : 1;
  document.getElementById('top-items-bars').innerHTML = topItems.length === 0
    ? '<p class="text-muted text-sm">No data yet.</p>'
    : topItems.map(({ item, qty }) => `
        <div class="report-bar-row">
          <div class="report-bar-label" title="${escHtml(item.name)}">${escHtml(item.name)}</div>
          <div class="report-bar-track"><div class="report-bar-fill" style="width:${Math.round((qty/maxQty)*100)}%"></div></div>
          <div class="report-bar-val">${qty}</div>
        </div>`).join('');

  // Status breakdown
  const statuses = ['pending','preparing','ready','dispatched','delivered','cancelled'];
  const statusCounts = {};
  statuses.forEach(s => statusCounts[s] = 0);
  orders.forEach(o => { if (statusCounts[o.status] !== undefined) statusCounts[o.status]++; });
  const maxCount = Math.max(1, ...Object.values(statusCounts));
  document.getElementById('status-bars').innerHTML = statuses.map(s => `
    <div class="report-bar-row">
      <div class="report-bar-label" style="text-transform:capitalize;">${s}</div>
      <div class="report-bar-track"><div class="report-bar-fill" style="width:${Math.round((statusCounts[s]/maxCount)*100)}%"></div></div>
      <div class="report-bar-val">${statusCounts[s]}</div>
    </div>`).join('');

  // Recent orders
  const recent = [...orders].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 10);
  document.getElementById('report-orders-tbody').innerHTML = recent.map(o => {
    const cu = Data.getUser(o.customer_id);
    const ic = o.items.reduce((s,i) => s + i.quantity, 0);
    return `<tr>
      <td><a href="order-detail.html?id=${o.id}">#${o.id}</a></td>
      <td>${cu ? escHtml(cu.username) : 'Unknown'}</td>
      <td class="text-muted">${ic}</td>
      <td>${UI.formatCurrency(Data.getOrderTotal(o))}</td>
      <td>${UI.statusBadge(o.status)}</td>
      <td class="text-muted text-sm">${UI.formatDate(o.created_at)}</td>
    </tr>`;
  }).join('');
});

function escHtml(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(str || ''));
  return d.innerHTML;
}
</script>
</body>
</html>
