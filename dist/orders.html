<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders – Quick Serve</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-wrapper">
  <header class="topbar">
    <a href="index.html" class="topbar-brand">Quick Serve</a>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <a href="#" id="topbar-logout">Sign out</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Orders</h1>
          <p id="orders-subtitle"></p>
        </div>
        <a href="order-create.html" class="btn btn-primary">Place New Order</a>
      </div>

      <!-- Filters -->
      <div class="card" style="padding:.9rem 1.25rem; margin-bottom:1.25rem;">
        <div class="flex gap-2 items-center" style="flex-wrap:wrap;">
          <select class="form-control" id="status-filter" style="max-width:200px;">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="preparing">Preparing</option>
            <option value="ready">Ready</option>
            <option value="dispatched">Dispatched</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <input class="form-control" type="search" id="search-order" placeholder="Search by order ID..." style="max-width:200px;">
          <span class="text-muted text-sm" id="order-count"></span>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="orders-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <footer>Quick Serve Menu Ordering System &copy; 2024</footer>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = Auth.require();
  if (!user) return;
  UI.renderTopbar(user);
  renderSidebar('orders', user);

  let allOrders = user.is_staff ? Data.getOrders() : Data.getOrdersForUser(user.id);
  allOrders = [...allOrders].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  document.getElementById('orders-subtitle').textContent = user.is_staff ? 'All customer orders.' : 'Your order history.';

  function render() {
    const statusVal = document.getElementById('status-filter').value;
    const q = document.getElementById('search-order').value.trim();
    let orders = allOrders;
    if (statusVal !== 'all') orders = orders.filter(o => o.status === statusVal);
    if (q) orders = orders.filter(o => String(o.id).includes(q));

    document.getElementById('order-count').textContent = `${orders.length} order${orders.length !== 1 ? 's' : ''}`;
    const tbody = document.getElementById('orders-tbody');
    if (orders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="tbl-empty">No orders found.</td></tr>';
      return;
    }
    tbody.innerHTML = orders.map(o => {
      const customer = Data.getUser(o.customer_id);
      const itemCount = o.items.reduce((s, i) => s + i.quantity, 0);
      return `<tr>
        <td><a href="order-detail.html?id=${o.id}">#${o.id}</a></td>
        <td>${customer ? escHtml(customer.username) : 'Unknown'}</td>
        <td class="text-muted">${itemCount} item${itemCount !== 1 ? 's' : ''}</td>
        <td>${UI.formatCurrency(Data.getOrderTotal(o))}</td>
        <td>${UI.statusBadge(o.status)}</td>
        <td class="text-muted text-sm">${UI.formatDate(o.created_at)}</td>
        <td>
          <a href="order-detail.html?id=${o.id}" class="btn btn-xs btn-secondary">View</a>
          ${user.is_staff ? `<a href="order-manage.html?id=${o.id}" class="btn btn-xs btn-secondary">Manage</a>` : ''}
        </td>
      </tr>`;
    }).join('');
  }

  document.getElementById('status-filter').addEventListener('change', render);
  document.getElementById('search-order').addEventListener('input', render);
  render();
});

function escHtml(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(str || ''));
  return d.innerHTML;
}
</script>
</body>
</html>
