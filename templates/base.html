<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Serve</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        nav a { margin-right: 1rem; }
        table, th, td { border: 1px solid #ccc; border-collapse: collapse; padding: 0.4rem; }
    </style>
</head>
<body>
    <h1>Quick Serve Menu Ordering System</h1>
    <nav>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'menu-list' %}">Menu</a>
        <a href="{% url 'order-create' %}">Place Order</a>
        <a href="{% url 'order-history' %}">Orders</a>
        <a href="{% url 'customer-profile' %}">Customer Profile</a>
        {% if request.user.is_staff %}
            <a href="{% url 'menu-manage' %}">Manage Menu</a>
            <a href="{% url 'sales-report' %}">Reports</a>
        {% endif %}
        {% if request.user.is_authenticated %}
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Signup</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
