{% extends "base.html" %}
{% block content %}
<h2>Manage Menu</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Item</button>
</form>

<h3>Current Items</h3>
<table>
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Available</th>
    </tr>
    {% for item in items %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.is_available }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
