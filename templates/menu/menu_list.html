{% extends "base.html" %}
{% block content %}
<h2>Menu</h2>
<table>
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
    </tr>
    {% for item in items %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.description }}</td>
        <td>{{ item.price }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No menu items available.</td></tr>
    {% endfor %}
</table>
{% endblock %}
