{% extends "base.html" %}

{% block title %}Password Changed — QuickServe{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-8 col-lg-5">
    <div class="card shadow-sm border-0 mt-4 text-center">
      <div class="card-body p-5">

        <div class="mb-3" style="font-size: 3rem;"></div>
        <h4 class="card-title fw-bold mb-2">Password changed successfully!</h4>
        <p class="text-muted mb-4">Your account password has been updated. You can now log in with your new password.</p>

        <a href="{% url 'customer-profile' %}" class="btn btn-warning fw-semibold px-4">
          <i class="fa fa-user me-1"></i>Back to Profile
        </a>

      </div>
    </div>
  </div>
</div>
{% endblock %}
